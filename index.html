<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, height=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hub Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      width: 1024px;
      height: 600px;
      overflow: hidden;
      user-select: none;
      background-color: #120d0a;
      color: #dfd2be;
      font-family: 'Special Elite', monospace;
    }
    .font-western { font-family: 'Rye', serif; }
    .western-panel {
      background-color: #1c140e;
      border: 2px solid #5c3a21;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 4px 6px rgba(0,0,0,0.6);
    }
    .western-btn {
      background-color: #2b1a10;
      border: 1px solid #784725;
      transition: all 0.15s ease-in-out;
    }
    .western-btn:active {
      transform: scale(0.96);
      background-color: #4a2814;
    }
  </style>
</head>
<body class="p-4 flex flex-col justify-between box-border">

  <!-- TOP BAR: KLOCKA & DATUM -->
  <header class="western-panel rounded-lg px-6 py-3 flex items-center justify-between">
    <div>
      <div id="time" class="text-6xl font-western text-amber-500 tracking-wider">--:--</div>
      <div id="date" class="text-base text-amber-200/70 capitalize mt-1">Laddar datum...</div>
    </div>
    <div class="text-right">
      <span class="text-xs uppercase tracking-widest text-amber-600 block">Outpost Hub</span>
      <span class="text-sm text-stone-400">Småland • Central</span>
    </div>
  </header>

  <!-- MITTENSEKTION: VÄDER & HEMSTYRNING -->
  <main class="grid grid-cols-2 gap-4 my-auto h-[350px]">
    
    <!-- 1. VÄDER (OPEN-METEO) -->
    <div class="western-panel rounded-lg p-5 flex flex-col justify-between">
      <div class="border-b border-amber-900/50 pb-2 flex justify-between items-baseline">
        <h2 class="text-amber-500 font-western text-xl tracking-wide">Väder</h2>
        <span class="text-xs text-stone-400">Lokalt</span>
      </div>

      <div class="flex items-center justify-around my-auto">
        <div class="text-center">
          <div id="weather-temp" class="text-6xl font-western text-stone-100">--°C</div>
          <div id="weather-desc" class="text-base text-amber-300/90 mt-2">Hämtar data...</div>
        </div>
        <div class="space-y-2 text-sm text-stone-300 border-l border-amber-900/40 pl-6">
          <div>Vind: <strong id="weather-wind" class="text-stone-100">-- m/s</strong></div>
          <div>Luftfuktighet: <strong id="weather-humidity" class="text-stone-100">--%</strong></div>
          <div>Känns som: <strong id="weather-apparent" class="text-stone-100">--°C</strong></div>
        </div>
      </div>

      <div class="text-xs text-stone-500 flex justify-between border-t border-amber-900/40 pt-2">
        <span>Källa: Open-Meteo</span>
        <span id="weather-updated">--:--</span>
      </div>
    </div>

    <!-- 2. HEMSTYRNING (WEBHOOKS) -->
    <div class="western-panel rounded-lg p-5 flex flex-col justify-between">
      <div class="border-b border-amber-900/50 pb-2 flex justify-between items-baseline">
        <h2 class="text-amber-500 font-western text-xl tracking-wide">Hemstyrning</h2>
        <span id="status-msg" class="text-xs text-amber-400/80">Redo</span>
      </div>

      <div class="grid grid-cols-2 gap-3 my-auto">
        <button onclick="triggerDevice('lights_on')" class="western-btn p-3 rounded text-left flex flex-col justify-between shadow cursor-pointer">
          <span class="text-amber-500 font-bold text-sm">💡 Tänd Belysning</span>
          <span class="text-[11px] text-stone-400 mt-1">Alla rum</span>
        </button>

        <button onclick="triggerDevice('lights_off')" class="western-btn p-3 rounded text-left flex flex-col justify-between shadow cursor-pointer">
          <span class="text-stone-400 font-bold text-sm">🌙 Släck Allt</span>
          <span class="text-[11px] text-stone-500 mt-1">Nattläge</span>
        </button>

        <button onclick="triggerDevice('scene_evening')" class="western-btn p-3 rounded text-left flex flex-col justify-between shadow cursor-pointer">
          <span class="text-amber-400 font-bold text-sm">🔥 Mysbelysning</span>
          <span class="text-[11px] text-stone-400 mt-1">Dämpat sken</span>
        </button>

        <button onclick="triggerDevice('scene_out')" class="western-btn p-3 rounded text-left flex flex-col justify-between shadow cursor-pointer">
          <span class="text-amber-600 font-bold text-sm">🚪 Hejdå-läge</span>
          <span class="text-[11px] text-stone-400 mt-1">Lås & släck</span>
        </button>
      </div>

      <div class="text-[11px] text-stone-500 text-center border-t border-amber-900/40 pt-2">
        HTTP Webhooks
      </div>
    </div>

  </main>

  <!-- STATUSRAD -->
  <footer class="text-center text-[10px] text-amber-900 tracking-widest uppercase">
    Standby Screen • Automated Kiosk Mode
  </footer>

  <script>
    // 1. KLOCKA & DATUM
    function updateClock() {
      const now = new Date();
      document.getElementById('time').innerText = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').innerText = now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. VÄDER (OPEN-METEO)
    const WMO_SV = {
      0: "Klart", 1: "Mestadels klart", 2: "Halvklart", 3: "Mulet",
      45: "Dimma", 48: "Rimfrost/dimma", 51: "Lätt duggregn", 53: "Duggregn",
      55: "Tätt duggregn", 61: "Lätt regn", 63: "Regn", 65: "Kraftigt regn",
      71: "Lätt snöfall", 73: "Snöfall", 75: "Kraftigt snöfall",
      80: "Lätta skurar", 81: "Regnskurar", 82: "Kraftiga skurar",
      95: "Åska", 96: "Åska m. hagel"
    };

    async function fetchWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=57.18&longitude=14.04&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&wind_speed_unit=ms");
        if (!res.ok) throw new Error();
        const data = await res.json();
        const cur = data.current;

        document.getElementById('weather-temp').innerText = `${Math.round(cur.temperature_2m)}°C`;
        document.getElementById('weather-apparent').innerText = `${Math.round(cur.apparent_temperature)}°C`;
        document.getElementById('weather-wind').innerText = `${cur.wind_speed_10m} m/s`;
        document.getElementById('weather-humidity').innerText = `${cur.relative_humidity_2m}%`;
        document.getElementById('weather-desc').innerText = WMO_SV[cur.weather_code] || "Klart";
        document.getElementById('weather-updated').innerText = new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      } catch (err) {
        document.getElementById('weather-desc').innerText = "Kunde ej hämta data";
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 10 * 60 * 1000);

    // 3. HEMSTYRNING
    // Skriv in webbadresser till dina egna IFTTT/Home Assistant-webhooks här vid behov
    const WEBHOOK_URLS = {
      lights_on: "",
      lights_off: "",
      scene_evening: "",
      scene_out: ""
    };

    function triggerDevice(actionKey) {
      const status = document.getElementById('status-msg');
      const url = WEBHOOK_URLS[actionKey];

      status.innerText = "Skickar signal...";

      if (!url) {
        // Kör ett simulerat tryck om inga URL:er är ifyllda än
        setTimeout(() => {
          status.innerText = "Signal skickad (Demo)";
          setTimeout(() => status.innerText = "Redo", 2500);
        }, 250);
        return;
      }

      fetch(url, { method: 'POST', mode: 'no-cors' })
        .then(() => {
          status.innerText = "Kommando skickat!";
          setTimeout(() => status.innerText = "Redo", 2500);
        })
        .catch(() => {
          status.innerText = "Kunde inte ansluta";
          setTimeout(() => status.innerText = "Redo", 2500);
        });
    }

    // 4. SCREEN WAKE LOCK
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  </script>
</body>
</html>
