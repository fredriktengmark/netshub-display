<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, height=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Western Outpost Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Sancreek&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #120e0b;
      --panel-bg: #1c1510;
      --wood-border: #442a1a;
      --brass: #c89b3c;
      --brass-dim: #7a5f25;
      --parchment: #d6c6a2;
      --text-muted: #8b7965;
      --active-glow: #e07a1e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 1024px;
      height: 600px;
      overflow: hidden;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at center, #241913 0%, #0d0907 100%);
      color: var(--parchment);
      font-family: 'Special Elite', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard {
      width: 1024px;
      height: 600px;
      padding: 12px;
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 12px;
    }

    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--brass-dim);
      outline: 1px solid var(--wood-border);
      outline-offset: -4px;
      border-radius: 4px;
      padding: 14px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-family: 'Rye', serif;
      font-size: 15px;
      color: var(--brass);
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 1px dashed var(--brass-dim);
      padding-bottom: 5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Vänster kolumn */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    .clock-panel {
      padding: 10px 14px;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .time-display {
      font-family: 'Rye', serif;
      font-size: 52px;
      color: var(--brass);
      text-shadow: 0 0 10px rgba(200, 155, 60, 0.3);
      line-height: 1;
    }

    .date-display {
      font-size: 13px;
      color: var(--parchment);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .weather-panel {
      flex: 1;
      justify-content: space-between;
    }

    .weather-current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .weather-temp {
      font-family: 'Rye', serif;
      font-size: 38px;
      color: var(--parchment);
    }

    .weather-desc {
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
    }

    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
      border-top: 1px solid #2d2017;
      padding-top: 6px;
      font-size: 11px;
    }

    .weather-val {
      color: var(--brass);
      font-weight: bold;
    }

    /* 5-Dagarsprognos */
    .forecast-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--brass-dim);
      letter-spacing: 1px;
      margin-top: 8px;
      margin-bottom: 4px;
      border-top: 1px dashed #2d2017;
      padding-top: 6px;
    }

    .forecast-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .forecast-day {
      background: #150f0c;
      border: 1px solid #3d2b1d;
      border-radius: 3px;
      padding: 6px 2px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .fc-name {
      font-size: 11px;
      color: var(--parchment);
      font-weight: bold;
      text-transform: uppercase;
    }

    .fc-icon {
      font-size: 15px;
      margin: 2px 0;
    }

    .fc-temps {
      font-size: 10px;
      line-height: 1.1;
    }

    .fc-max {
      color: var(--brass);
      font-weight: bold;
    }

    .fc-min {
      color: var(--text-muted);
    }

    /* Höger kolumn: Hemstyrning */
    .controls-panel {
      height: 100%;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      flex: 1;
    }

    .btn-card {
      background: #150f0c;
      border: 1px solid #3d2b1d;
      border-radius: 4px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .btn-card.active {
      border-color: var(--active-glow);
      box-shadow: inset 0 0 15px rgba(224, 122, 30, 0.2), 0 0 8px rgba(224, 122, 30, 0.3);
    }

    .btn-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-icon {
      font-size: 22px;
      opacity: 0.75;
    }

    .btn-card.active .btn-icon {
      opacity: 1;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #332219;
    }

    .btn-card.active .status-dot {
      background: var(--active-glow);
      box-shadow: 0 0 6px var(--active-glow);
    }

    .btn-name {
      font-size: 15px;
      font-weight: bold;
      color: var(--parchment);
    }

    .btn-status-text {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .btn-card.active .btn-status-text {
      color: var(--brass);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Vänster sektion -->
    <div class="left-col">
      <div class="panel clock-panel">
        <div class="time-display" id="time">--:--</div>
        <div class="date-display" id="date">Laddar datum...</div>
      </div>

      <div class="panel weather-panel">
        <div>
          <div class="panel-title">
            <span>Värnamo Utpost</span>
            <span style="font-size: 10px; color: var(--text-muted);">METEO NORD</span>
          </div>
          <div class="weather-current">
            <div class="weather-temp" id="temp">--°C</div>
            <div class="weather-desc" id="weather-text">Hämtar data...</div>
          </div>
          <div class="weather-details">
            <div>Vind: <span class="weather-val" id="wind">-- m/s</span></div>
            <div>Fukt: <span class="weather-val" id="humidity">--%</span></div>
            <div>Nederbörd: <span class="weather-val" id="precip">-- mm</span></div>
            <div>Riktning: <span class="weather-val" id="wind-dir">--</span></div>
          </div>
        </div>

        <div>
          <div class="forecast-title">5-Dagarsprognos</div>
          <div class="forecast-strip" id="forecast-container">
            <!-- 5 dagar renderas via JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- Höger sektion: Styrpanel -->
    <div class="panel controls-panel">
      <div class="panel-title">
        <span>Kontrollpanel // Kvarteret</span>
        <span style="font-size: 11px; color: var(--brass-dim);">SYSTEM: ONLINE</span>
      </div>
      <div class="control-grid">
        <div class="btn-card" onclick="toggleSwitch(this)">
          <div class="btn-header">
            <span class="btn-icon">💡</span>
            <div class="status-dot"></div>
          </div>
          <div>
            <div class="btn-name">Saloon Ljus</div>
            <div class="btn-status-text">FRÅN</div>
          </div>
        </div>

        <div class="btn-card" onclick="toggleSwitch(this)">
          <div class="btn-header">
            <span class="btn-icon">🪵</span>
            <div class="status-dot"></div>
          </div>
          <div>
            <div class="btn-name">Kamin / Fläkt</div>
            <div class="btn-status-text">FRÅN</div>
          </div>
        </div>

        <div class="btn-card" onclick="toggleSwitch(this)">
          <div class="btn-header">
            <span class="btn-icon">🏮</span>
            <div class="status-dot"></div>
          </div>
          <div>
            <div class="btn-name">Verandalampor</div>
            <div class="btn-status-text">FRÅN</div>
          </div>
        </div>

        <div class="btn-card active" onclick="toggleSwitch(this)">
          <div class="btn-header">
            <span class="btn-icon">📻</span>
            <div class="status-dot"></div>
          </div>
          <div>
            <div class="btn-name">Trådlös Radio</div>
            <div class="btn-status-text">TILL</div>
          </div>
        </div>

        <div class="btn-card" onclick="toggleSwitch(this)">
          <div class="btn-header">
            <span class="btn-icon">🔒</span>
            <div class="status-dot"></div>
          </div>
          <div>
            <div class="btn-name">Gårdslås</div>
            <div class="btn-status-text">FRÅN</div>
          </div>
        </div>

        <div class="btn-card active" onclick="toggleSwitch(this)">
          <div class="btn-header">
            <span class="btn-icon">⚡</span>
            <div class="status-dot"></div>
          </div>
          <div>
            <div class="btn-name">Verkstad 230V</div>
            <div class="btn-status-text">TILL</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Klocka
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('date').textContent = now.toLocaleDateString('sv-SE', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Värnamo koordinater & väderkodning
    const LAT = 57.183;
    const LON = 14.041;

    const weatherMeta = {
      0:  { text: "Klar himmel",  icon: "☀️" },
      1:  { text: "Mest klart",   icon: "🌤️" },
      2:  { text: "Halvklart",    icon: "⛅" },
      3:  { text: "Mulet",        icon: "☁️" },
      45: { text: "Dimma",        icon: "🌫️" },
      48: { text: "Rimfrost",     icon: "🌫️" },
      51: { text: "Duggregn",     icon: "🌦️" },
      61: { text: "Lätt regn",    icon: "🌧️" },
      63: { text: "Regn",         icon: "🌧️" },
      65: { text: "Skyfall",      icon: "🌧️" },
      71: { text: "Lätt snö",     icon: "🌨️" },
      73: { text: "Snöfall",      icon: "❄️" },
      75: { text: "Ymnig snö",    icon: "❄️" },
      95: { text: "Åskväder",     icon: "⛈️" }
    };

    function getWeatherMeta(code) {
      return weatherMeta[code] || { text: "Omväxlande", icon: "🌤️" };
    }

    function getWindDirection(deg) {
      const dirs = ['N', 'NO', 'O', 'SO', 'S', 'SV', 'V', 'NV'];
      return dirs[Math.round(deg / 45) % 8];
    }

    async function fetchWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,precipitation,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBerlin&forecast_days=6&wind_speed_unit=ms`;
        const res = await fetch(url);
        const data = await res.json();

        // Nuvarande väder
        const curr = data.current;
        const currMeta = getWeatherMeta(curr.weather_code);
        document.getElementById('temp').textContent = `${Math.round(curr.temperature_2m)}°C`;
        document.getElementById('weather-text').textContent = `${currMeta.icon} ${currMeta.text}`;
        document.getElementById('wind').textContent = `${curr.wind_speed_10m.toFixed(1)} m/s`;
        document.getElementById('humidity').textContent = `${curr.relative_humidity_2m}%`;
        document.getElementById('precip').textContent = `${curr.precipitation} mm`;
        document.getElementById('wind-dir').textContent = getWindDirection(curr.wind_direction_10m);

        // 5-dagarsprognos (index 1 t.o.m 5, dvs kommande 5 dagar)
        const daily = data.daily;
        const container = document.getElementById('forecast-container');
        container.innerHTML = '';

        for (let i = 1; i <= 5; i++) {
          const date = new Date(daily.time[i]);
          const dayName = date.toLocaleDateString('sv-SE', { weekday: 'short' }).replace('.', '');
          const meta = getWeatherMeta(daily.weather_code[i]);
          const maxT = Math.round(daily.temperature_2m_max[i]);
          const minT = Math.round(daily.temperature_2m_min[i]);

          const card = document.createElement('div');
          card.className = 'forecast-day';
          card.innerHTML = `
            <div class="fc-name">${dayName}</div>
            <div class="fc-icon">${meta.icon}</div>
            <div class="fc-temps">
              <span class="fc-max">${maxT}°</span>
              <br>
              <span class="fc-min">${minT}°</span>
            </div>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        document.getElementById('weather-text').textContent = "Signalfel";
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 600000);

    function toggleSwitch(element) {
      element.classList.toggle('active');
      const statusText = element.querySelector('.btn-status-text');
      statusText.textContent = element.classList.contains('active') ? 'TILL' : 'FRÅN';
    }
  </script>
</body>
</html>
