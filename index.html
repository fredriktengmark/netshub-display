<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, height=600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hub Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      width: 1024px;
      height: 600px;
      overflow: hidden;
      user-select: none;
      background-color: #120d0a;
      color: #dfd2be;
      font-family: 'Special Elite', monospace;
    }
    .font-western { font-family: 'Rye', serif; }
    .western-panel {
      background-color: #1c140e;
      border: 2px solid #5c3a21;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 4px 6px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body class="p-4 flex flex-col justify-between box-border">

  <!-- TOP BAR: KLOCKA & DATUM -->
  <header class="western-panel rounded-lg px-6 py-3 flex items-center justify-between">
    <div>
      <div id="time" class="text-6xl font-western text-amber-500 tracking-wider">--:--</div>
      <div id="date" class="text-base text-amber-200/70 capitalize mt-1">Laddar datum...</div>
    </div>
    <div class="text-right">
      <span class="text-xs uppercase tracking-widest text-amber-600 block">Outpost Hub</span>
      <span class="text-sm text-stone-400">Småland • SE3</span>
    </div>
  </header>

  <!-- MITTENSEKTION -->
  <main class="grid grid-cols-3 gap-4 my-auto h-[340px]">
    
    <!-- 1. VÄDER -->
    <div class="western-panel rounded-lg p-4 flex flex-col justify-between">
      <div class="border-b border-amber-900/50 pb-1">
        <h2 class="text-amber-500 font-western text-lg tracking-wide">Väder</h2>
        <span class="text-xs text-stone-400" id="weather-source">Hämtar data...</span>
      </div>
      <div class="my-auto text-center">
        <div id="weather-temp" class="text-5xl font-western text-stone-100">--°C</div>
        <div id="weather-desc" class="text-sm text-amber-300/80 mt-2">Läser in...</div>
      </div>
      <div class="text-xs text-stone-400 flex justify-between border-t border-amber-900/40 pt-2">
        <span>Vind: <strong id="weather-wind" class="text-stone-200">-- m/s</strong></span>
        <span id="weather-updated">--:--</span>
      </div>
    </div>

    <!-- 2. ELPRIS (SE3) -->
    <div class="western-panel rounded-lg p-4 flex flex-col justify-between">
      <div class="border-b border-amber-900/50 pb-1 flex justify-between items-end">
        <h2 class="text-amber-500 font-western text-lg tracking-wide">Spotpris</h2>
        <span class="text-xs text-amber-700 font-bold">SE3</span>
      </div>
      <div class="my-auto text-center">
        <div id="price-current" class="text-5xl font-western text-amber-400">--</div>
        <div class="text-xs uppercase tracking-widest text-stone-400 mt-1">Öre / kWh</div>
      </div>
      <div class="grid grid-cols-2 text-center text-xs border-t border-amber-900/40 pt-2 gap-2 text-stone-300">
        <div class="bg-black/40 rounded p-1">Min: <span id="price-min" class="text-emerald-400">--</span></div>
        <div class="bg-black/40 rounded p-1">Max: <span id="price-max" class="text-rose-400">--</span></div>
      </div>
    </div>

    <!-- 3. WEBRADIO (COUNTRY) -->
    <div class="western-panel rounded-lg p-4 flex flex-col justify-between">
      <div class="border-b border-amber-900/50 pb-1">
        <h2 class="text-amber-500 font-western text-lg tracking-wide">Saloon Radio</h2>
        <span class="text-xs text-stone-400">Live Country Stream</span>
      </div>
      <div class="my-auto flex flex-col items-center">
        <!-- Direkt HTTPS Icecast MP3-ström med öppna CORS-headers -->
        <audio id="radio-audio" preload="none" crossorigin="anonymous">
          <source src="https://ais-sa2.cdnstream1.com/1976_128.mp3" type="audio/mpeg">
        </audio>
        <button id="radio-btn" onclick="toggleRadio()" class="w-20 h-20 rounded-full border-2 border-amber-600 bg-amber-950/60 hover:bg-amber-900/80 active:scale-95 flex items-center justify-center transition shadow-lg cursor-pointer">
          <span id="radio-icon" class="text-amber-400 text-3xl ml-1">▶</span>
        </button>
        <span id="radio-status" class="text-xs text-stone-400 mt-3">Avstängd</span>
      </div>
      <div class="text-[11px] text-stone-500 text-center border-t border-amber-900/40 pt-2">
        Tryck för att starta / pausa
      </div>
    </div>

  </main>

  <footer class="text-center text-[10px] text-amber-900 tracking-widest uppercase">
    Standby Screen • Automated Kiosk Mode
  </footer>

  <script>
    // 1. KLOCKA & DATUM
    function updateClock() {
      const now = new Date();
      document.getElementById('time').innerText = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').innerText = now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. VÄDER (SMHI MED AUTOMATISK OPEN-METEO FALLBACK)
    const SMHI_CODES = {
      1: "Klart", 2: "Mestadels klart", 3: "Halvklart", 4: "Halvmulet",
      5: "Molnigt", 6: "Mulet", 7: "Dimma", 8: "Lätta regnskurar",
      9: "Måttliga regnskurar", 10: "Kraftiga regnskurar", 11: "Åskskurar",
      18: "Lätt regn", 19: "Måttligt regn", 20: "Kraftigt regn",
      25: "Lätt snöfall", 26: "Måttligt snöfall", 27: "Ymnigt snöfall"
    };

    const WMO_CODES = {
      0: "Klart", 1: "Mestadels klart", 2: "Halvklart", 3: "Mulet",
      45: "Dimma", 51: "Lätt duggregn", 61: "Lätt regn", 63: "Måttligt regn",
      65: "Kraftigt regn", 71: "Lätt snö", 73: "Snöfall", 95: "Åska"
    };

    async function fetchWeather() {
      const lat = "57.183300";
      const lon = "14.041600";
      
      // Försök SMHI först
      try {
        const res = await fetch(`https://opendata-download-metfcst.smhi.se/api/category/pmp3g/version/2/geotype/point/lon/${lon}/lat/${lat}/data.json`);
        if (!res.ok) throw new Error("SMHI fel");
        const data = await res.json();
        const point = data.timeSeries[0];
        
        const getVal = (name) => point.parameters.find(p => p.name === name)?.values[0];
        const temp = Math.round(getVal('t'));
        const wind = getVal('ws');
        const symbol = getVal('Wsymb2');

        document.getElementById('weather-temp').innerText = `${temp}°C`;
        document.getElementById('weather-wind').innerText = `${wind} m/s`;
        document.getElementById('weather-desc').innerText = SMHI_CODES[symbol] || "Växlande";
        document.getElementById('weather-source').innerText = "Värnamo (SMHI)";
        document.getElementById('weather-updated').innerText = new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
        return;
      } catch (e) {
        console.warn("SMHI svarade inte, byter till fallback...");
      }

      // Fallback: Open-Meteo (garanterat CORS-öppet och stabilt)
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=57.18&longitude=14.04&current=temperature_2m,weather_code,wind_speed_10m&wind_speed_unit=ms`);
        const data = await res.json();
        const cur = data.current;

        document.getElementById('weather-temp').innerText = `${Math.round(cur.temperature_2m)}°C`;
        document.getElementById('weather-wind').innerText = `${cur.wind_speed_10m} m/s`;
        document.getElementById('weather-desc').innerText = WMO_CODES[cur.weather_code] || "Klart";
        document.getElementById('weather-source').innerText = "Värnamo";
        document.getElementById('weather-updated').innerText = new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      } catch (err) {
        document.getElementById('weather-desc').innerText = "Kunde ej ladda väder";
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 10 * 60 * 1000);

    // 3. ELPRISER (SE3)
    async function fetchPowerPrice() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      
      try {
        const res = await fetch(`https://www.elprisetjustnu.se/api/v1/prices/${year}/${month}-${day}_SE3.json`);
        if (!res.ok) throw new Error("Kunde inte hämta elpris");
        const prices = await res.json();

        const currentHour = now.getHours();
        const currentData = prices.find(p => new Date(p.time_start).getHours() === currentHour) || prices[0];
        const oreValues = prices.map(p => Math.round(p.SEK_per_kWh * 100));

        document.getElementById('price-current').innerText = Math.round(currentData.SEK_per_kWh * 100);
        document.getElementById('price-min').innerText = `${Math.min(...oreValues)} öre`;
        document.getElementById('price-max').innerText = `${Math.max(...oreValues)} öre`;
      } catch (err) {
        document.getElementById('price-current').innerText = "--";
      }
    }
    fetchPowerPrice();
    setInterval(fetchPowerPrice, 15 * 60 * 1000);

    // 4. WEBRADIO
    const audio = document.getElementById('radio-audio');
    const radioBtn = document.getElementById('radio-btn');
    const radioIcon = document.getElementById('radio-icon');
    const radioStatus = document.getElementById('radio-status');

    function toggleRadio() {
      if (audio.paused) {
        radioStatus.innerText = "Ansluter...";
        audio.play().then(() => {
          radioIcon.innerText = "❚❚";
          radioIcon.classList.remove('ml-1');
          radioStatus.innerText = "Spelar nu...";
          radioStatus.classList.add('text-amber-400');
        }).catch((err) => {
          console.error("Ljudfel:", err);
          radioStatus.innerText = "Kunde ej ansluta";
          radioStatus.classList.remove('text-amber-400');
        });
      } else {
        audio.pause();
        radioIcon.innerText = "▶";
        radioIcon.classList.add('ml-1');
        radioStatus.innerText = "Pausad";
        radioStatus.classList.remove('text-amber-400');
      }
    }

    // 5. SKÄRMLÅS (WAKE LOCK)
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  </script>
</body>
</html>
